[workspace]
resolver = "2"
members = ["crates/scanner", "crates/gateway"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
# librustzcash — keep these in lockstep (one release train)
zcash_client_backend = { version = "0.25", default-features = false, features = ["orchard", "lightwalletd-tonic"] }
zcash_keys = { version = "0.17", features = ["orchard", "sapling"] }
zcash_primitives = "0.31"
zcash_protocol = "0.11"
orchard = "0.16"
sapling = { package = "sapling-crypto", version = "0.9" }
zip32 = "0.3"

anyhow = "1"
dotenvy = "0.15"
getrandom = "0.3"
clap = { version = "4", features = ["derive", "env"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "tls-webpki-roots"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "sync"] }
